name: Send Daily Update Email

# Once-a-day summary of every commit that landed in the Fusion suite.
# Fires at 9:00 PM PT (= 04:00 UTC next day) so the digest captures the
# whole working day. Silent when no commits land. Forwardable HTML
# email so Alex can fan it out to people who aren't in the portal.
#
# Required secrets:
#   GMAIL_TOKEN_JSON          (same OAuth token the other send-*.py
#                              scripts use — gmail.modify scope)
#   GMAIL_FROM                (sender address)
#   GH_TOKEN                  (optional — needed for the private
#                              fusion-bid-list repo)
#
# Optional secret:
#   DAILY_UPDATE_RECIPIENTS   comma-separated email list. Defaults to
#                             alex@fusionelectric-inc.com when unset.

on:
  schedule:
    # 04:00 UTC = 21:00 PT (9 PM). DST drifts the local time by 1h
    # twice a year — acceptable for an end-of-day digest.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      recipients:
        description: "Override DAILY_UPDATE_RECIPIENTS (comma-separated emails). Leave blank to use the secret/default."
        required: false
        default: ""

concurrency:
  group: send-daily-update-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt google-api-python-client google-auth-oauthlib
      - name: Send daily update digest
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DAILY_UPDATE_RECIPIENTS: ${{ inputs.recipients != '' && inputs.recipients || secrets.DAILY_UPDATE_RECIPIENTS }}
        run: python send-daily-update-email.py
