name: Sync Goals to Supabase

# Same SharePoint xlsm as bid-list -- the TRACKING sheet inside it
# holds annual division goals. Reusing BID_LIST_URL secret.
#
# Triggered by the Netlify cron-cloud-syncs function (workflow_dispatch
# every minute) or the schedule below as a fallback.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-goals
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run cloud parser -> Supabase
        env:
          BID_LIST_URL: ${{ secrets.BID_LIST_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python cloud-sync-goals.py --url "$BID_LIST_URL" --supabase-write
