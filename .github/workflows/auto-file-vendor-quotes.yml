name: Auto-file vendor quotes (DISABLED)

# DISABLED 2026-05-22 -- Alex flagged that the filter is too loose:
# the cron was filing email signature images (QualitySound logos,
# Outlook-*.png, "3D Logo.png", image001.png/gif from signature blocks)
# into bid QUOTES folders. ~20 files of junk landed in EST# 26-239
# OTIS ES ALAMEDA on first successful run after the dep fix.
#
# What needs to happen before re-enabling:
#   1. Tighten the filter -- PDF/XLSX/DOCX whitelist (no images), raise
#      MIN_ATTACHMENT_BYTES, exclude filenames matching Outlook-*,
#      image00*.png, *Logo*, *signature*, etc.
#   2. Sender-domain heuristic -- vendor quotes come from vendor
#      domains, not plan-room / CC services.
#   3. Optional: AI classifier on the body to confirm "this looks like
#      a quote" before filing.
#
# Until that's in, manual workflow_dispatch only -- schedule is commented.

on:
  # schedule:
  #   - cron: "*/15 13-23 * * 1-5"   # DISABLED -- see comment above
  workflow_dispatch: {}

concurrency:
  group: auto-file-vendor-quotes
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: File vendor quotes
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        run: python auto-file-vendor-quotes.py
