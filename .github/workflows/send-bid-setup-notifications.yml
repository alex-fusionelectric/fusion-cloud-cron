name: Send bid-setup notifications (DISABLED)

# DISABLED 2026-05-22 -- this cron sent the old plain-text "Bid setup
# complete" format that flooded Alex + Gabriel at 1:04 AM PT after a
# 2-3 week silent failure recovered. The new HTML-format bid-setup
# email is sent directly from the watcher (via send-bid-setup-email.js
# Netlify function) the instant setup finishes -- the cron was a
# redundant backup path that we no longer want.
#
# Schedule is intentionally removed so this can only fire by manual
# workflow_dispatch, and the script itself has a 48h staleness guard
# (commit 1a0b951) that drops un-notified rows older than 48h.
#
# To re-enable: restore the cron line below + DELETE this comment block.
# Before doing that, confirm with Alex that the old plain-text format
# is what we actually want -- there's a follow-up plan to consolidate
# email policy into an admin-managed email_policies_cloud table.

on:
  # schedule:
  #   - cron: "*/5 * * * *"   # DISABLED -- see comment block above
  workflow_dispatch: {}

concurrency:
  group: send-bid-setup-notifications
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send bid setup notifications
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
        run: python send-bid-setup-notifications.py
