name: Check watcher heartbeat

# Reads the latest row from local_watcher_status_cloud and emails Alex on
# transitions between online and offline. State is persisted in
# watcher_alert_state_cloud so we don't double-email.
#
# Runs every 5 minutes -- threshold for "offline" is 15 min, so worst-case
# detection lag is ~20 min.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: check-watcher-heartbeat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt google-api-python-client google-auth-oauthlib
      - name: Check watcher heartbeat
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          ALERT_TO_EMAIL: alex@fusionelectric-inc.com
        run: python check-watcher-heartbeat.py
