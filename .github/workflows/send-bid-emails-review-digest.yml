name: Send bid-emails review digest (DISABLED)

# DISABLED 2026-05-22 -- Alex didn't have this on the approved email list
# (only bid_setup_complete / addenda_alert / daily_changes / weekly_digest
# are sanctioned). The "review needed" pile is 265 deep so dumping it
# every morning at 7 AM PT was noise.
#
# Schedule removed -- can only fire via manual workflow_dispatch. The
# script itself now also reads from email_policies_cloud.bid_review_digest
# and exits when enabled=false (default).
#
# To turn back on: flip ENABLED in /admin/ Email Center -> Bid Review
# Digest, then re-add the cron line below.

on:
  # schedule:
  #   - cron: "0 14 * * 1-5"   # 06-07 AM PT M-F -- DISABLED
  workflow_dispatch: {}

concurrency:
  group: send-bid-emails-review-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send digest
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
        run: python send-bid-emails-review-digest.py
