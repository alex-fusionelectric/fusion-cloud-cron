name: Send weekly company digest

# Sunday-evening company-wide roll-up: bids won/lost this week, addenda
# processed, software updates, completions. Recipients pulled from
# email_policies_cloud.weekly_digest.
#
# Runs Sundays at 6:00 PM PT (= Mon 01:00 UTC in PDT, 02:00 UTC in PST).
# We schedule the PDT slot and accept the 1-hour drift in winter.

on:
  schedule:
    - cron: "0 1 * * 1"   # 01:00 UTC Monday = 6:00 PM PT (PDT) Sunday
  workflow_dispatch: {}

concurrency:
  group: send-weekly-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send weekly digest
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GMAIL_TOKEN_JSON:     ${{ secrets.GMAIL_TOKEN_JSON }}
          GMAIL_FROM:           ${{ secrets.GMAIL_FROM }}
          GH_TOKEN:             ${{ secrets.GITHUB_TOKEN }}
        run: python send-weekly-digest.py
