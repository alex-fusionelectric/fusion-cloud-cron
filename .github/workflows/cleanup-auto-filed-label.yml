name: Cleanup AUTO-FILED Gmail label (manual)

# Audit + optionally remove the AUTO-FILED label the auto-file-vendor-quotes
# cron added to every thread it processed. Three modes via workflow input:
#   audit   -- just list what's tagged
#   unlabel -- remove label from threads (keep label definition)
#   nuke    -- remove label from threads AND delete the label itself

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit | unlabel | nuke"
        required: true
        default: "audit"
      dry_run:
        description: "Dry run (no changes) -- 'no' to actually act"
        required: true
        default: "yes"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cleanup AUTO-FILED
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          MODE:    ${{ github.event.inputs.mode }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'yes' && '1' || '0' }}
        run: python cleanup-auto-filed-label.py
